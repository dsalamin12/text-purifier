<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Text Purifier</title>
    <style>
        body { font-family: 'Inter', -apple-system, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 40px 20px; }
        .box { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 700px; width: 100%; }
        h2 { color: #2c3e50; margin-top: 0; font-size: 24px; }
        p.subtitle { font-size: 14px; color: #7f8c8d; margin-bottom: 20px; }
        textarea { width: 100%; height: 250px; padding: 15px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; box-sizing: border-box; transition: 0.3s; line-height: 1.6; }
        textarea:focus { border-color: #3498db; outline: none; }
        .stats { margin-top: 15px; font-size: 13px; color: #95a5a6; display: flex; gap: 20px; background: #fafafa; padding: 10px; border-radius: 8px; }
        .btns { margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
        button { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; }
        .btn-main { background: #3498db; color: white; }
        .btn-main:hover { background: #2980b9; }
        .btn-alt { background: #ecf0f1; color: #2c3e50; }
        .btn-alt:hover { background: #bdc3c7; }
        .btn-danger { background: #fff5f5; color: #e74c3c; border: 1px solid #ffcccc; }
        .btn-danger:hover { background: #fee2e2; }
    </style>
</head>
<body>

<div class="box">
    <h2>Universal Text Purifier</h2>
    <p class="subtitle">Quickly fix messy formatting, PDF breaks, and extra spaces.</p>
    
    <textarea id="textInput" placeholder="Paste your text here..."></textarea>
    
    <div class="stats">
        <span>Words: <b id="wordCount">0</b></span>
        <span>Characters: <b id="charCount">0</b></span>
    </div>

    <div class="btns">
        <button class="btn-main" onclick="cleanSpaces()">Clean Extra Spaces</button>
        <button class="btn-main" onclick="removeBreaks()">Remove Line Breaks</button>
        <button class="btn-alt" onclick="toTitleCase()">Title Case</button>
        <button class="btn-alt" onclick="copyText()">Copy Result</button>
        <button class="btn-danger" onclick="clearAll()">Clear All</button>
    </div>
</div>

<script>
    const input = document.getElementById('textInput');

    function updateStats() {
        const text = input.value.trim();
        document.getElementById('wordCount').innerText = text ? text.split(/\s+/).length : 0;
        document.getElementById('charCount').innerText = text.length;
    }

    input.addEventListener('input', updateStats);

    // 1. Cleans double spaces but keeps paragraphs
    function cleanSpaces() {
        input.value = input.value.replace(/[ ]+/g, ' ').trim();
        updateStats();
    }

    // 2. Removes all enters/line breaks and joins text
    function removeBreaks() {
        input.value = input.value.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();
        updateStats();
    }

    // 3. Converts to Title Case
    function toTitleCase() {
        input.value = input.value.toLowerCase().split(' ').map(word => {
            return word.charAt(0).toUpperCase() + word.slice(1);
        }).join(' ');
        updateStats();
    }

    // 4. Copy to Clipboard
    function copyText() {
        if (!input.value) return;
        navigator.clipboard.writeText(input.value);
        alert("Copied to clipboard!");
    }

    // 5. Clear everything
    function clearAll() {
        if(confirm("Are you sure you want to clear the text?")) {
            input.value = "";
            updateStats();
        }
    }
</script>

</body>
</html>
